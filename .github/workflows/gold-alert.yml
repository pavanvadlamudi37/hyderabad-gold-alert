name: Hyderabad 22K gold alert

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyderabad-gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and alert logic
        run: python -m unittest discover -s tests -v
      - name: Restore persistent state
        run: python state_store.py load
      - name: Check price and send qualifying alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_THRESHOLD_INR: ${{ vars.GOLD_THRESHOLD_INR }}
        run: python gold_alert.py
      - name: Persist successful observation
        run: python state_store.py save
